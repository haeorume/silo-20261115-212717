<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DailyList</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text); }
    header, nav { display:flex; gap:8px; align-items:center; padding:16px 24px; }
    header { justify-content:space-between; background:var(--surface); border-bottom:1px solid var(--border); }
    h1 { font-size:var(--title); margin:0; }
    button.cta, button.primary { background:var(--primary); color:#fff; border:0; border-radius:999px; padding:10px 16px; }
    main.board { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:24px; }
    section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; min-height:280px; }
    article { background:var(--bg); border-radius:8px; padding:12px; margin:8px 0; }
    .empty { color:var(--muted); }
    .toast { position:fixed; right:16px; bottom:16px; background:#0f172a; color:#fff; padding:8px 12px; border-radius:8px; }
    .err { background:#fef2f2; color:var(--danger); padding:8px 24px; }
    @media (max-width:768px) { main.board { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>DailyList — 할 일을 빠르게 추가하고 완료 표시할 수 있는 간단한 할 일 목록 SaaS</h1><p>오늘 해야 할 일을 한눈에 정리하고, 완료한 건은 바로 체크하세요.</p></div>
    <button class="cta" type="button" id="start">지금 시작하기</button>
  </header>
  <nav>
    <button type="button" data-view="board">보드</button>
    <button type="button" data-view="list">리스트</button>
    <button type="button" data-view="timeline">타임라인</button>
    <button class="primary" type="button" id="add">카드 추가</button>
  </nav>
  <p id="err" class="err" hidden>저장에 실패했습니다. <button type="button" id="retry">다시 시도</button></p>
  <main id="app" class="board"></main>
  <p id="toast" class="toast" hidden>저장됨</p>
  <script>
    const KEY='taskflow-v1';
    const COLS=['todo','doing','done'];
    const LABELS={todo:'To do',doing:'Doing',done:'Done'};
    let view='board';
    function load(){ try { return JSON.parse(localStorage.getItem(KEY)||'[]'); } catch(e) { return []; } }
    function save(cards){ try { localStorage.setItem(KEY, JSON.stringify(cards)); toast(); return true; } catch(e) { err(true); return false; } }
    function toast(){ const t=document.getElementById('toast'); t.hidden=false; setTimeout(()=>t.hidden=true,1200); }
    function err(on){ document.getElementById('err').hidden=!on; }
    function add(){ const title=window.prompt('카드 제목'); if(!title) return; const cards=load(); cards.push({id:String(Date.now()), title, col:'todo', due:''}); save(cards); draw(); }
    function move(id, col){ save(load().map(c=>c.id===id?{...c,col}:c)); draw(); }
    function draw(){
      const cards=load(); const app=document.getElementById('app');
      app.className = view==='board' ? 'board' : '';
      if(view==='list'){
        app.innerHTML = cards.length ? '<table><thead><tr><th>카드</th><th>상태</th></tr></thead><tbody>'+cards.map(c=>'<tr><td>'+c.title+'</td><td><select data-id="'+c.id+'">'+COLS.map(x=>'<option value="'+x+'"'+(c.col===x?' selected':'')+'>'+LABELS[x]+'</option>').join('')+'</select></td></tr>').join('')+'</tbody></table>' : '<p class="empty">첫 카드를 추가하세요</p>';
      } else if(view==='timeline'){
        app.innerHTML = COLS.map(col=>'<section><h2>'+LABELS[col]+'</h2>'+(cards.filter(c=>c.col===col).map(c=>'<article>'+c.title+'</article>').join('')||'<p class="empty">비어 있음</p>')+'</section>').join('');
      } else {
        app.innerHTML = COLS.map(col=>'<section><h2>'+LABELS[col]+'</h2>'+(cards.filter(c=>c.col===col).map(c=>'<article>'+c.title+' <select data-id="'+c.id+'">'+COLS.map(x=>'<option value="'+x+'"'+(c.col===x?' selected':'')+'>'+LABELS[x]+'</option>').join('')+'</select></article>').join('')||'<p class="empty">첫 카드를 추가하세요</p>')+'<button type="button" data-add="'+col+'">카드 추가</button></section>').join('');
      }
      app.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>move(s.dataset.id,s.value));
      app.querySelectorAll('[data-add]').forEach(b=>b.onclick=add);
    }
    document.getElementById('add').onclick=add;
    document.getElementById('start').onclick=add;
    document.getElementById('retry').onclick=()=>{ err(false); draw(); };
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ view=b.dataset.view; draw(); });
    draw();
  </script>
</body>
</html>
