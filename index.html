<!doctype html>
<html lang="ko" data-silo-stage="clone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DailyList — 로컬 클론</title>
<style>:root{--bg:#f9f7f6;--surface:#ffffff;--text:#25221e;--muted:#6f6d6b;--primary:#e34432;--font:Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;--radius:8px;} *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px} .banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;background:var(--text);color:#fff;font-size:13px} .banner a{color:#fff} .shell{display:flex;min-height:calc(100% - 40px)} aside{width:240px;background:var(--surface);padding:20px 12px;border-right:1px solid #25221e14} .brand{font-weight:700;margin:0 12px 16px;letter-spacing:-.02em} .nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:8px 12px;border-radius:var(--radius);cursor:pointer} .nav.on{background:#e3443214;color:var(--primary);font-weight:600} main{flex:1;padding:28px 32px;max-width:720px} h1{font-size:22px;margin:0 0 16px} form{display:flex;gap:8px;margin:0 0 16px} input[name=title]{flex:1;border:1px solid #25221e2e;border-radius:var(--radius);padding:10px 12px;font:inherit;background:var(--surface);color:var(--text)} button[type=submit]{background:var(--primary);color:#fff;border:0;border-radius:var(--radius);padding:10px 14px;font:inherit;cursor:pointer} #empty{color:var(--muted)} ul{list-style:none;margin:0;padding:0} li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #25221e14} li.done span{color:var(--muted);text-decoration:line-through} .check{width:20px;height:20px;border:2px solid var(--primary);border-radius:50%;background:transparent;cursor:pointer;flex-shrink:0} li.done .check{background:var(--primary)}</style>
</head>
<body>
<div class="banner"><span>로컬 클론 · todoist.com · 원본 서버에 붙지 않습니다</span><span>원본 스냅샷: <a href="public/sites/todoist-com/index.html">todoist-com</a> <a href="public/sites/trello-com/index.html">trello-com</a></span></div>
<div class="shell">
<aside>
<p class="brand">todoist.com</p>
<button type="button" class="nav on" data-list="today">오늘</button>
<button type="button" class="nav" data-list="inbox">받은 편지함</button>
<button type="button" class="nav" data-list="upcoming">다음</button>
</aside>
<main>
<h1 id="heading">오늘</h1>
<form id="add">
<input name="title" placeholder="작업 추가" autocomplete="off" aria-label="작업 추가">
<button type="submit">추가</button>
</form>
<p id="empty">할 일을 추가하세요</p>
<ul id="list"></ul>
</main>
</div>
<script>
const KEY="silo-clone-dailylist";
const LABELS={today:'오늘',inbox:'받은 편지함',upcoming:'다음'};
let filter='today';
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[];}catch(e){return[];}}
function save(items){localStorage.setItem(KEY,JSON.stringify(items));}
function render(){
  const items=load();
  const shown=items.filter(it=>it.list===filter);
  document.getElementById('heading').textContent=LABELS[filter];
  document.querySelectorAll('.nav').forEach(btn=>{btn.classList.toggle('on',btn.getAttribute('data-list')===filter);});
  const empty=document.getElementById('empty');
  const ul=document.getElementById('list');
  empty.hidden=shown.length>0;
  ul.innerHTML=shown.map(it=>'<li class="'+(it.completed?'done':'')+'" data-id="'+it.id+'"><button type="button" class="check" aria-label="완료"></button><span>'+it.title.replace(/</g,'&lt;')+'</span></li>').join('');
}
document.getElementById('add').addEventListener('submit',e=>{
  e.preventDefault();
  const input=e.target.title;
  const title=(input.value||'').trim();
  if(!title)return;
  const items=load();
  items.push({id:String(Date.now()),title,completed:false,list:filter});
  save(items);input.value='';render();
});
document.getElementById('list').addEventListener('click',e=>{
  const li=e.target.closest('li');
  if(!li||!e.target.classList.contains('check'))return;
  const items=load().map(it=>it.id===li.dataset.id?{...it,completed:!it.completed}:it);
  save(items);render();
});
document.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.getAttribute('data-list');render();}));
render();
</script>
</body>
</html>
