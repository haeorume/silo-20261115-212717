<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DailyList — 클론</title>
  <style>
    html, body { height: 100%; margin: 0; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; height: 48px;
      display: flex; gap: 8px; align-items: center; padding: 0 12px;
      background: #111; z-index: 2;
    }
    nav button {
      color: #fff; background: transparent; border: 1px solid #444;
      border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit;
    }
    nav button[aria-current="true"] { background: #fff; color: #111; }
    iframe {
      position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
      width: 100%; height: calc(100% - 48px); border: 0; background: #fff;
    }
  </style>
</head>
<body>
  <nav>
    <button type="button" data-src="public/sites/todoist-com/index.html" aria-current="true">Todoist 클론</button>
    <button type="button" data-src="public/sites/trello-com/index.html">Trello 클론</button>
  </nav>
  <iframe id="clone" src="public/sites/todoist-com/index.html" title="Todoist clone"></iframe>
  <script>
    const frame = document.getElementById("clone");
    document.querySelectorAll("nav button[data-src]").forEach((btn) => {
      btn.onclick = () => {
        frame.src = btn.getAttribute("data-src");
        frame.title = btn.textContent || "clone";
        document.querySelectorAll("nav button[data-src]").forEach((other) => {
          other.setAttribute("aria-current", other === btn ? "true" : "false");
        });
      };
    });
  </script>
</body>
</html>
